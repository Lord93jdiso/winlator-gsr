name: Build Winlator GSR APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components (platform, build-tools, NDK 24, CMake 3.22.1)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Build APK (debug, installable)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: winlator-gsr-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Rename APK with version
        run: |
          VERSION=$(grep -o 'versionName "[^"]*"' app/build.gradle | head -1 | cut -d'"' -f2)
          cp app/build/outputs/apk/debug/app-debug.apk "Winlator-GSR-${VERSION}-arm64.apk" || true

      - name: Upload renamed APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-GSR-APK-renamed
          path: Winlator-GSR-*-arm64.apk
          if-no-files-found: ignore
