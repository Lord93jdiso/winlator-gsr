name: Build Winlator GSR APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android cmdline-tools + SDK components (platform, build-tools, NDK 24, CMake 3.22.1)
        run: |
          set -e
          SDK="/usr/local/lib/android/sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          curl -sSL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o clt.zip -d "$SDK/cmdline-tools"
          rm -rf "$SDK/cmdline-tools/latest"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;24.0.8215888" "cmake;3.22.1" > /dev/null
          echo "sdk.dir=$SDK" > local.properties

      - name: Build APK (debug, installable)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK with version
        run: |
          VERSION=$(grep -o 'versionName "[^"]*"' app/build.gradle | head -1 | cut -d'"' -f2)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Winlator-GSR-${VERSION}-arm64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-GSR-APK
          path: dist/*.apk
          if-no-files-found: error
